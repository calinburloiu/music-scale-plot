<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Scale Plot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="left-column">
    <div class="panel settings-panel">
      <h2>Settings</h2>
      <div class="base-note-row">
        <label for="base-note">Base Note</label>
        <select id="base-note">
          <option value="0">A</option>
          <option value="2">B</option>
          <option value="3">C</option>
          <option value="5">D</option>
          <option value="7">E</option>
          <option value="8">F</option>
          <option value="10">G</option>
        </select>
      </div>
      <div class="interval-type-row">
        <label for="interval-type">Interval Type</label>
        <select id="interval-type">
          <option value="ratio">Ratios</option>
          <option value="edo">Equal Division of the Octave (EDO)</option>
          <option value="cents">Cents</option>
        </select>
      </div>
      <div class="edo-settings-row" id="edo-settings" style="display: none;">
        <label for="edo-divisions">Divisions per Octave</label>
        <div class="edo-input-stack">
          <input type="number" id="edo-divisions" value="12" min="1">
          <span id="edo-cents-label"></span>
        </div>
      </div>
    </div>
    <div class="panel editor-panel">
      <h2>Scale Editor</h2>
      <div id="editor">
        <div class="row note-row" data-degree="1">
          <button class="play-note" title="Play note">&#9654;</button>
          <label>Note 1</label>
          <span class="cumulative-cents"></span>
          <input type="text" class="note-name" placeholder="name">
        </div>
        <div class="row interval-row">
          <input type="text" class="interval" placeholder="ratio" value="9/8">
          <span class="cents-label"></span>
          <div class="interval-label-cluster">
            <input type="text" class="interval-label" placeholder="label">
            <div class="color-picker-wrapper">
              <button type="button" class="color-swatch" data-color="#FFFFFF" style="background:#FFFFFF;"></button>
              <div class="color-dropdown"></div>
            </div>
          </div>
        </div>
        <div class="row note-row" data-degree="2">
          <button class="play-note" title="Play note">&#9654;</button>
          <label>Note 2</label>
          <span class="cumulative-cents"></span>
          <input type="text" class="note-name" placeholder="name">
        </div>
      </div>
      <div class="editor-controls">
        <button id="add-note">Add note</button>
        <button id="remove-note">Remove last note</button>
      </div>
    </div>
    </div>
    <div class="panel chart-panel">
      <h2>Chart</h2>
      <div class="chart-toolbar">
        <div class="chart-toolbar-row">
          <button id="save-png">Save as PNG</button>
        </div>
        <div class="chart-toolbar-row">
          <label for="chart-style">Style</label>
          <select id="chart-style">
            <option value="boxes">Boxes</option>
            <option value="lines">Line</option>
          </select>
        </div>
        <div class="chart-toolbar-row">
          <label for="orientation">Orientation</label>
          <select id="orientation">
            <option value="vertical">Vertical</option>
            <option value="horizontal">Horizontal</option>
          </select>
        </div>
        <div class="chart-toolbar-row">
          <label for="zoom">Zoom</label>
          <input type="range" id="zoom" min="10" max="100" value="100" step="5">
          <span id="zoom-value">100%</span>
        </div>
      </div>
      <canvas id="chart"></canvas>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
