<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Scale Plot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar-bar">
    <div id="toolbar" role="toolbar" aria-label="File and scale actions">
      <button type="button" id="new-file" class="toolbar-btn" aria-label="New" title="New">
        <img src="icons/new.svg" alt="">
      </button>
      <button type="button" id="open-file" class="toolbar-btn" aria-label="Open" title="Open">
        <img src="icons/open.svg" alt="">
      </button>
      <div class="save-menu-wrapper">
        <button type="button" id="save-menu" class="toolbar-btn has-caret" aria-label="Save" title="Save"
                aria-haspopup="menu" aria-expanded="false">
          <img src="icons/save.svg" alt="">
        </button>
        <div class="save-menu-panel" id="save-menu-panel">
          <button type="button" id="save-scale">Save As Music Scale Plot file</button>
          <hr>
          <button type="button" id="save-png">Save Chart As PNG</button>
          <button type="button" id="save-audio">Save Audio As WAV</button>
        </div>
      </div>
      <span class="toolbar-separator"></span>
      <button type="button" id="add-note" class="toolbar-btn" aria-label="Add note" title="Add note">
        <img src="icons/add-note.svg" alt="">
      </button>
      <button type="button" id="remove-note" class="toolbar-btn" aria-label="Remove last note" title="Remove last note">
        <img src="icons/remove-note.svg" alt="">
      </button>
      <span class="toolbar-separator"></span>
      <button type="button" id="play-scale" class="toolbar-btn" aria-label="Play scale" title="Play scale">
        <img src="icons/play.svg" alt="">
      </button>
      <button type="button" id="stop-scale" class="toolbar-btn" aria-label="Stop playing" title="Stop playing" disabled>
        <img src="icons/stop.svg" alt="">
      </button>
      <input type="file" id="open-file-input" accept=".musp.json,application/json" hidden>
    </div>
    <div id="toolbar-message" role="alert" hidden>
      <span id="toolbar-message-text"></span>
      <button type="button" id="toolbar-message-dismiss" aria-label="Dismiss message"></button>
    </div>
  </div>
  <div class="container">
    <div class="left-column">
    <div class="panel settings-panel">
      <h2>Settings</h2>
      <div class="notation-row">
        <label for="notation">Notation</label>
        <select id="notation">
          <option value="generic">Generic</option>
          <option value="byzantine">Byzantine</option>
        </select>
      </div>
      <div class="base-note-row">
        <label for="base-note">Base Note</label>
        <select id="base-note">
          <option value="0">C</option>
          <option value="1">C&#9839;/D&#9837;</option>
          <option value="2">D</option>
          <option value="3">D&#9839;/E&#9837;</option>
          <option value="4">E</option>
          <option value="5">F</option>
          <option value="6">F&#9839;/G&#9837;</option>
          <option value="7">G</option>
          <option value="8">G&#9839;/A&#9837;</option>
          <option value="9">A</option>
          <option value="10">A&#9839;/B&#9837;</option>
          <option value="11">B</option>
        </select>
      </div>
    </div>
    <div class="panel editor-panel">
      <h2>Scale Editor</h2>
      <div class="scale-name-row">
        <label for="scale-name">Name</label>
        <input type="text" id="scale-name" placeholder="untitled">
      </div>
      <div class="interval-type-row">
        <label for="interval-type">Interval Type</label>
        <select id="interval-type">
          <option value="ratio">Ratio</option>
          <option value="edo">Equal Division of the Octave (EDO)</option>
          <option value="cents">Cents</option>
        </select>
      </div>
      <div class="edo-settings-row" id="edo-settings" style="display: none;">
        <label for="edo-divisions">Divisions per Octave</label>
        <div class="edo-input-stack">
          <input type="number" id="edo-divisions" value="12" min="1">
          <span id="edo-cents-label"></span>
        </div>
      </div>
      <div class="scale-mode-row">
        <label for="scale-mode">Mode</label>
        <select id="scale-mode">
          <option value="relative">Relative Intervals</option>
          <option value="absolute">Absolute Intervals</option>
        </select>
      </div>
      <div id="editor">
        <div class="row note-row" data-degree="1">
          <button class="play-note" title="Play note">&#9654;</button>
          <label>Note 1</label>
          <span class="cumulative-cents"></span>
          <div class="accidental-well-wrapper">
            <button type="button" class="accidental-well is-empty" title="Accidental"></button>
            <div class="accidental-picker"></div>
          </div>
          <input type="text" class="note-name" placeholder="name">
          <div class="alteration-well-wrapper">
            <button type="button" class="alteration-well is-empty" title="Sign of alteration"></button>
            <div class="alteration-picker"></div>
          </div>
          <div class="fthora-well-wrapper">
            <button type="button" class="fthora-well is-empty" title="Fthora"></button>
            <div class="fthora-picker"></div>
          </div>
          <div class="martyria-well-wrapper">
            <button type="button" class="martyria-well is-empty" title="Martyria"></button>
            <div class="martyria-picker"></div>
          </div>
        </div>
        <div class="row interval-row">
          <input type="text" class="interval" placeholder="ratio" value="9/8">
          <span class="cents-label"></span>
          <div class="interval-label-cluster">
            <div class="color-picker-wrapper">
              <button type="button" class="color-swatch" data-color="#FFFFFF" style="background:#FFFFFF;"></button>
              <div class="color-dropdown"></div>
            </div>
            <input type="text" class="interval-label" placeholder="label">
          </div>
        </div>
        <div class="row note-row" data-degree="2">
          <button class="play-note" title="Play note">&#9654;</button>
          <label>Note 2</label>
          <span class="cumulative-cents"></span>
          <div class="accidental-well-wrapper">
            <button type="button" class="accidental-well is-empty" title="Accidental"></button>
            <div class="accidental-picker"></div>
          </div>
          <input type="text" class="note-name" placeholder="name">
          <div class="alteration-well-wrapper">
            <button type="button" class="alteration-well is-empty" title="Sign of alteration"></button>
            <div class="alteration-picker"></div>
          </div>
          <div class="fthora-well-wrapper">
            <button type="button" class="fthora-well is-empty" title="Fthora"></button>
            <div class="fthora-picker"></div>
          </div>
          <div class="martyria-well-wrapper">
            <button type="button" class="martyria-well is-empty" title="Martyria"></button>
            <div class="martyria-picker"></div>
          </div>
        </div>
      </div>
    </div>
    </div>
    <div class="panel chart-panel">
      <h2>Chart</h2>
      <div class="chart-toolbar">
        <div class="chart-toolbar-row">
          <label for="chart-style">Style</label>
          <select id="chart-style">
            <option value="boxes">Boxes</option>
            <option value="lines">Segments</option>
          </select>
        </div>
        <div class="chart-toolbar-row">
          <label for="orientation">Orientation</label>
          <select id="orientation">
            <option value="vertical">Vertical</option>
            <option value="horizontal">Horizontal</option>
          </select>
        </div>
        <div class="chart-toolbar-row">
          <label for="zoom">Zoom</label>
          <input type="range" id="zoom" min="10" max="100" value="100" step="5">
          <span id="zoom-value">100%</span>
        </div>
      </div>
      <canvas id="chart"></canvas>
    </div>
  </div>
  <script src="byzantine.js" defer></script>
  <script src="smufl.js" defer></script>
  <script src="persistence.js" defer></script>
  <script src="audio.js" defer></script>
  <script src="symbols-ui.js" defer></script>
  <script src="byzantine-ui.js" defer></script>
  <script src="persistence-ui.js" defer></script>
  <script src="audio-ui.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
